<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f1e8" />
  <title>Pusara Abadi – Block Directions</title>
  <style>
    :root {
      --bg: #f4f1e8;
      --card: #ffffff;
      --text: #1e2a25;
      --muted: #5f6b66;
      --primary: #1f5b46;
      --primary-hover: #174535;
      --office: #7a5a2f;
      --office-hover: #604624;
      --border: #d9d5ca;
      --shadow: 0 4px 18px rgba(0,0,0,.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }
    main {
      width: min(100% - 28px, 560px);
      margin: 0 auto;
      padding: 28px 0 40px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 24px 18px;
    }
    .eyebrow {
      margin: 0;
      text-align: center;
      font-size: .95rem;
      font-weight: 800;
      letter-spacing: .12em;
      color: var(--primary);
    }
    h1 {
      margin: 4px 0 8px;
      text-align: center;
      font-size: clamp(1.9rem, 7vw, 2.5rem);
      line-height: 1.1;
    }
    .instruction {
      margin: 0 0 22px;
      text-align: center;
      font-size: 1.12rem;
      color: var(--muted);
    }
    .button-list {
      display: grid;
      gap: 12px;
    }
    .direction-button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 62px;
      width: 100%;
      padding: 14px 18px;
      border-radius: 12px;
      background: var(--primary);
      color: #fff;
      text-decoration: none;
      text-align: center;
      font-size: 1.15rem;
      font-weight: 700;
      border: 2px solid var(--primary);
      touch-action: manipulation;
    }
    .direction-button:hover,
    .direction-button:focus-visible {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }
    .direction-button:focus-visible {
      outline: 4px solid rgba(31, 91, 70, .25);
      outline-offset: 3px;
    }
    .office-section {
      margin-top: 26px;
      padding-top: 22px;
      border-top: 2px solid var(--border);
    }
    .office-section p {
      margin: 0 0 12px;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 700;
    }
    .office-button {
      background: var(--office);
      border-color: var(--office);
    }
    .office-button:hover,
    .office-button:focus-visible {
      background: var(--office-hover);
      border-color: var(--office-hover);
    }
    @media (max-width: 380px) {
      main { width: min(100% - 20px, 560px); }
      .card { padding: 20px 14px; }
      .direction-button { font-size: 1.05rem; min-height: 60px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="page-title">
      <p class="eyebrow">PUSARA ABADI</p>
      <h1 id="page-title">Block Directions</h1>
      <p class="instruction">Tap the block you want to visit.</p>

      <div id="block-buttons" class="button-list" aria-label="Pusara Abadi block directions"></div>

      <div class="office-section">
        <p>Need to return to the Wareesan Office?</p>
        <a class="direction-button office-button"
           href="https://www.google.com/maps/dir/?api=1&destination=Wareesan%3A%20Muslim%20Cemetery%20Exhumation%20Office%2C%207%20Chinese%20Cemetery%20Path%203%2C%20Singapore%20718773&travelmode=walking&dir_action=navigate"
           target="_blank" rel="noopener noreferrer">
          Get directions to Wareesan Office
        </a>
      </div>
    </section>
  </main>

  <script>
    const blocks = [
      { name: "Block 17", destination: "1692 Muslim Cemetery Path 20, Singapore", type: "address" },
      { name: "Block 23", destination: "Haji Abu Bakar Bin Bujok, 1391 Muslim Cemetery Path 24, Singapore", type: "address" },
      { name: "Block 24", destination: "Haji Abu Bakar Bin Bujok, 1391 Muslim Cemetery Path 24, Singapore", type: "address" },
      { name: "Block 25", destination: "3114 Muslim Cemetery Path 20, Singapore", type: "address" },
      { name: "Block 26", destination: "5135 Chinese Cemetery Path 21, Singapore", type: "address" },
      { name: "Block N-429", destination: "Haji Abu Bakar Bin Bujok, 1391 Muslim Cemetery Path 24, Singapore", type: "address" },
      { name: "Block N-1-1", destination: "5153 Chinese Cemetery Path 21, Singapore", type: "address" },
      { name: "Block N-1-2", destination: "3114 Muslim Cemetery Path 20, Singapore", type: "address" },
      { name: "Block N-1-3", destination: "3114 Muslim Cemetery Path 20, Singapore", type: "address" },
      { name: "Block N-1-4", destination: "Global Aquatics Pte Ltd, 15 Murai Farmway, Singapore 709150", type: "address" },
      { name: "Block N-1-15 – Shrouding Station", destination: "De Costa Meryn Brian@Mohd Sani Abdullah, Cemetery North Street 4, Singapore", type: "address" }
    ];

    function buildDirectionsUrl(destination) {
      return "https://www.google.com/maps/dir/?api=1"
        + "&destination=" + encodeURIComponent(destination)
        + "&travelmode=walking"
        + "&dir_action=navigate";
    }

    const container = document.getElementById("block-buttons");
    blocks.forEach((block) => {
      const link = document.createElement("a");
      link.className = "direction-button";
      link.textContent = block.name;
      link.href = buildDirectionsUrl(block.destination);
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.setAttribute("aria-label", "Get directions to " + block.name);
      container.appendChild(link);
    });
  </script>
</body>
</html>
