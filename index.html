<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#18362e" />
  <title>Pusara Abadi – Block Directions</title>
  <style>
    :root {
      --bg: #f4f6f3;
      --card: #ffffff;
      --text: #17201d;
      --muted: #5b6863;
      --primary: #18362e;
      --primary-hover: #0f2922;
      --border: #d9dfdc;
      --focus: #f4c95d;
      --radius: 16px;
    }
    * { box-sizing: border-box; }
    html { font-size: 18px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      width: min(100% - 28px, 620px);
      margin: 0 auto;
      padding: 30px 0 42px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px 18px;
      box-shadow: 0 8px 24px rgba(0,0,0,.05);
    }
    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(1.55rem, 5.6vw, 2.15rem);
      line-height: 1.08;
      letter-spacing: .02em;
      color: var(--primary);
    }
    h1 span {
      display: block;
      font-size: .72em;
      margin-top: 8px;
      font-weight: 700;
      color: var(--text);
    }
    .instruction {
      margin: 20px 0 18px;
      text-align: center;
      font-size: 1.05rem;
      color: var(--muted);
    }
    .buttons {
      display: grid;
      gap: 12px;
    }
    .map-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 62px;
      width: 100%;
      padding: 15px 18px;
      border-radius: var(--radius);
      text-decoration: none;
      text-align: center;
      font-weight: 700;
      font-size: 1.08rem;
      letter-spacing: .01em;
      color: #fff;
      background: var(--primary);
      border: 2px solid var(--primary);
      touch-action: manipulation;
    }
    .map-btn:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
    .map-btn:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
    .return-box {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }
    .return-label {
      margin: 0 0 12px;
      text-align: center;
      font-weight: 700;
      color: var(--text);
    }
    .office-btn {
      background: #fff;
      color: var(--primary);
      border-color: var(--primary);
    }
    .office-btn:hover { background: #edf3f0; color: var(--primary); }
    .foot {
      margin: 18px 0 0;
      text-align: center;
      font-size: .82rem;
      color: var(--muted);
    }
    @media (max-width: 380px) {
      html { font-size: 16px; }
      .wrap { width: min(100% - 20px, 620px); padding-top: 18px; }
      .card { padding: 20px 14px; }
      .map-btn { min-height: 58px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">PUSARA ABADI<span>Block Directions</span></h1>
      <p class="instruction">Tap the block you want to visit.</p>
      <nav id="blockButtons" class="buttons" aria-label="Cemetery block directions"></nav>

      <div class="return-box">
        <p class="return-label">Need to return to Wareesan Office?</p>
        <a
          class="map-btn office-btn"
          href="https://www.google.com/maps/dir/?api=1&destination=Wareesan%3A%20Muslim%20Cemetery%20Exhumation%20Office%2C%207%20Chinese%20Cemetery%20Path%203%2C%20Singapore%20718773&travelmode=walking&dir_action=navigate"
          target="_blank"
          rel="noopener noreferrer"
        >Get directions to Wareesan Office</a>
      </div>
    </section>
  </main>

  <script>
    /* ============================================================
       WAREESAN DESTINATION CONFIGURATION
       ------------------------------------------------------------
       Public users do not see the destination values below.

       IMPORTANT:
       - Keep every block as a separate entry, even if addresses match.
       - Replace address-based destinations only after on-site verification.
       - For affected/hoarded blocks, use an approved public access point,
         staff meeting point, or hoarding entrance — never the centre of an
         active work area.
       - A verified coordinate may be entered as: "1.234567,103.765432"
       - A Google Maps Place ID can also be supported later if required.
       - Do not enter unverified or invented coordinates.
       ============================================================ */

    const blocks = [
      { label: "Block 17", destination: "1692 Muslim Cemetery Path 20, Singapore" },
      { label: "Block 23", destination: "Haji Abu Bakar Bin Bujok, 1391 Muslim Cemetery Path 24, Singapore" },
      { label: "Block 24", destination: "Haji Abu Bakar Bin Bujok, 1391 Muslim Cemetery Path 24, Singapore" },
      { label: "Block 25", destination: "3114 Muslim Cemetery Path 20, Singapore" },
      { label: "Block 26", destination: "5135 Chinese Cemetery Path 21, Singapore" },
      { label: "Block N-429", destination: "Haji Abu Bakar Bin Bujok, 1391 Muslim Cemetery Path 24, Singapore" },
      { label: "Block N-1-1", destination: "5153 Chinese Cemetery Path 21, Singapore" },
      { label: "Block N-1-2", destination: "3114 Muslim Cemetery Path 20, Singapore" },
      { label: "Block N-1-3", destination: "3114 Muslim Cemetery Path 20, Singapore" },
      { label: "Block N-1-4", destination: "Global Aquatics Pte Ltd, 15 Murai Farmway, Singapore 709150" },
      { label: "Block N-1-15 – Shrouding Station", destination: "De Costa Meryn Brian@Mohd Sani Abdullah, Cemetery North Street 4, Singapore" }
    ];

    function mapsDirectionsUrl(destination) {
      return "https://www.google.com/maps/dir/?api=1&destination=" +
        encodeURIComponent(destination) +
        "&travelmode=walking&dir_action=navigate";
    }

    const container = document.getElementById("blockButtons");
    blocks.forEach(({ label, destination }) => {
      const a = document.createElement("a");
      a.className = "map-btn";
      a.textContent = label;
      a.href = mapsDirectionsUrl(destination);
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.setAttribute("aria-label", `Get walking directions to ${label}`);
      container.appendChild(a);
    });
  </script>
</body>
</html>
